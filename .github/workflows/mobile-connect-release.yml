name: Mobile connect release artifact

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package versioned installer
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          node src/package-mobile-connect-release.js \
            --version "$version" \
            --output "dist/freebuff-mobile-connect-$version" \
            --archive

      - name: Validate package and installer tests
        shell: bash
        run: |
          set -euo pipefail
          node --check src/package-mobile-connect-release.js
          bash -n install-mobile-connect.sh
          node --test --test-timeout=10000 \
            src/package-mobile-connect-release.test.js \
            src/install-mobile-connect.test.js

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebuff-mobile-connect-${{ github.ref_name }}
          path: |
            dist/freebuff-mobile-connect-${{ github.ref_name }}
            dist/freebuff-mobile-connect-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30
