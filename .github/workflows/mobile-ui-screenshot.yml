name: Mobile UI screenshot regression

on:
  push:
    paths:
      - "src/mobile-ui.js"
      - "src/mobile-ui.css"
      - "src/mobile-ui-screenshot-fixture.html"
      - "src/mobile-ui-screenshot.test.js"
      - "src/freebuff_tailnet_proxy.js"
      - "src/freebuff-tailnet-proxy.test.js"
      - ".github/workflows/mobile-ui-screenshot.yml"
  pull_request:
    paths:
      - "src/mobile-ui.js"
      - "src/mobile-ui.css"
      - "src/mobile-ui-screenshot-fixture.html"
      - "src/mobile-ui-screenshot.test.js"
      - "src/freebuff_tailnet_proxy.js"
      - "src/freebuff-tailnet-proxy.test.js"
      - ".github/workflows/mobile-ui-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ui-screenshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run proxy cache revalidation tests
        shell: bash
        run: |
          set -euo pipefail
          node --check src/freebuff_tailnet_proxy.js
          node --test --test-timeout=10000 src/freebuff-tailnet-proxy.test.js

      - name: Capture mobile regression screenshot
        shell: bash
        env:
          FB_CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          FB_MOBILE_SCREENSHOT_DIR: ${{ runner.temp }}/freebuff-mobile-ui-screenshots
        run: |
          set -euo pipefail
          node --check src/mobile-ui.js
          node --check src/mobile-ui-screenshot.test.js
          node --test --test-timeout=20000 src/mobile-ui-screenshot.test.js

      - name: Upload mobile regression screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebuff-mobile-ui-screenshot-${{ github.sha }}
          path: ${{ runner.temp }}/freebuff-mobile-ui-screenshots
          if-no-files-found: warn
          retention-days: 14
