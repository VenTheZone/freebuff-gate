name: Android build and release

on:
  push:
    paths:
      - "android/**"
      - "src/mobile-connect-*.js"
      - "src/install-mobile-connect*.js"
      - "src/package-mobile-connect-release*.js"
      - "install-mobile-connect.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/mobile-connect-*.js"
      - "src/install-mobile-connect*.js"
      - "src/package-mobile-connect-release*.js"
      - "install-mobile-connect.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The emulator enforces a 6GiB minimum userdata partition (API >= 24) and
      # needs 1.2x that free, so the ~14GB runner can run short. Drop the
      # preinstalled NDK/CMake (several GB, unused by this no-native job) before
      # the build fills the disk again.
      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          df -h / | tail -n 1

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate ephemeral HTTPS relay certificate
        shell: bash
        run: |
          set -euo pipefail
          e2e_dir="$RUNNER_TEMP/freebuff-e2e"
          mkdir -p "$e2e_dir" android/app/src/debug/res/raw android/app/src/debug/res/xml android/app/src/androidTest/assets
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout "$e2e_dir/relay.key" \
            -out "$e2e_dir/relay.crt" \
            -subj "/CN=freebuff-ci-relay" \
            -addext "subjectAltName=IP:10.0.2.2,IP:127.0.0.1,DNS:localhost"
          chmod 600 "$e2e_dir/relay.key"
          cp "$e2e_dir/relay.crt" android/app/src/debug/res/raw/ci_relay_cert.pem
          python3 - <<'PY'
          from pathlib import Path

          Path("android/app/src/debug/res/xml/network_security_config.xml").write_text(
              """<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted=\"false\">
                  <trust-anchors>
                      <certificates src=\"system\" />
                      <certificates src=\"@raw/ci_relay_cert\" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          """,
              encoding="utf-8",
          )
          PY
          echo "FB_MOBILE_E2E_RELAY_ORIGIN=https://10.0.2.2:18495" >> "$GITHUB_ENV"

      - name: Start ephemeral relay and desktop fixture
        shell: bash
        run: |
          set -euo pipefail
          e2e_dir="$RUNNER_TEMP/freebuff-e2e"
          export FB_MOBILE_E2E_CERTIFICATE="$e2e_dir/relay.crt"
          export FB_MOBILE_E2E_KEY="$e2e_dir/relay.key"
          export FB_MOBILE_E2E_PAIRING_FILE="$e2e_dir/pairing.json"
          export NODE_EXTRA_CA_CERTS="$e2e_dir/relay.crt"
          nohup node src/mobile-connect-e2e-fixture.js > "$e2e_dir/fixture.log" 2>&1 &
          echo $! > "$e2e_dir/fixture.pid"
          for attempt in $(seq 1 100); do
            if test -s "$e2e_dir/pairing.json"; then
              cp "$e2e_dir/pairing.json" android/app/src/androidTest/assets/e2e-pairing.json
              exit 0
            fi
            if ! kill -0 "$(cat "$e2e_dir/fixture.pid")" 2>/dev/null; then
              cat "$e2e_dir/fixture.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$e2e_dir/fixture.log"
          echo "Timed out waiting for E2E fixture"
          exit 1

      - name: Run lint and assemble webview debug APK and test APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace \
            :app:clean \
            :app:lintWebviewDebug \
            :app:assembleWebviewDebug \
            :app:assembleWebviewDebugAndroidTest \

      - name: Enable KVM for emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify debug APK signature
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/webview/debug/app-webview-debug.apk"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${apksigner}"
          test -s "${apk}"
          "${apksigner}" verify --verbose --print-certs "${apk}"

      - name: Upload signed debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebuff-mobile-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/webview/debug/app-webview-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Android instrumentation and relay pairing E2E on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          working-directory: android
          script: >-
            gradle --no-daemon --stacktrace :app:connectedWebviewDebugAndroidTest

      - name: Stop ephemeral relay fixture and remove generated test inputs
        if: always()
        shell: bash
        run: |
          set +e
          e2e_dir="$RUNNER_TEMP/freebuff-e2e"
          if test -s "$e2e_dir/fixture.pid"; then
            kill "$(cat "$e2e_dir/fixture.pid")" 2>/dev/null || true
          fi
          rm -f \
            android/app/src/androidTest/assets/e2e-pairing.json \
            android/app/src/debug/res/raw/ci_relay_cert.pem \
            android/app/src/debug/res/xml/network_security_config.xml

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebuff-mobile-instrumentation-${{ github.sha }}
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
            ${{ runner.temp }}/freebuff-e2e/fixture.log
          if-no-files-found: warn
          retention-days: 14



  gecko-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build GeckoView spike APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace :app:assembleGeckoDebug

      - name: Upload GeckoView spike APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebuff-mobile-gecko-${{ github.sha }}
          path: android/app/build/outputs/apk/gecko/debug/app-gecko-debug.apk
          if-no-files-found: error
          retention-days: 14

  relay-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run managed relay integration tests
        shell: bash
        run: |
          set -o pipefail
          for file in \
            src/install-mobile-connect.js \
            src/mobile-connect-protocol.js \
            src/mobile-connect-gateway.js \
            src/mobile-connect-qr.js \
            src/mobile-connect-websocket.js \
            src/mobile-connect-relay.js \
            src/mobile-connect-agent.js \
            src/mobile-connect-e2e-fixture.js; do
            node --check "$file"
          done
          node --test --test-timeout=10000 \
            src/install-mobile-connect.test.js \
            src/mobile-connect-gateway.test.js \
            src/mobile-connect-qr.test.js \
            src/mobile-connect-relay.test.js \
            src/mobile-connect-agent.test.js | tee relay-tests.tap

      - name: Upload relay test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebuff-relay-tests-${{ github.sha }}
          path: relay-tests.tap
          if-no-files-found: warn
          retention-days: 14

  release-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The emulator needs ~7.4GB free for its userdata partition; drop the
      # preinstalled NDK/CMake this no-native job never uses.
      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM for emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Smoke-test the exact artifact that gets uploaded: the unpinned debug
      # APK installs, boots, renders the pairing screen, and passes the
      # offline security tests (origin guard, pairing payload rules,
      # keystore-backed identity). The full TLS pairing + gateway UI E2E runs
      # in the debug-apk job against the pinned build, which differs from the
      # generic one only in baked-in origin constants. The generic build
      # cannot be TLS-tested on the API 35 emulator: its trust store lives in
      # the immutable conscrypt APEX, which rejects runtime CA injection.
      - name: Smoke-test the generic debug APK on API 35 emulator before publishing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          working-directory: android
          script: >-
            gradle --no-daemon --stacktrace
            :app:connectedWebviewDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.freebuff.mobile.ReleaseArtifactSmokeInstrumentedTest,com.freebuff.mobile.PairingSecurityInstrumentedTest,com.freebuff.mobile.RestrictedWebViewInstrumentedTest

      - name: Upload release smoke test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebuff-mobile-release-smoke-${{ github.sha }}
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14

      - name: Verify debug APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/webview/debug/app-webview-debug.apk"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${apksigner}"
          test -s "${apk}"
          "${apksigner}" verify --verbose --print-certs "${apk}"

      - name: Prepare release signing keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            test -s "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PROPERTIES=-PfreebuffKeystorePath=$RUNNER_TEMP/release.keystore -PfreebuffKeystorePassword=$ANDROID_KEYSTORE_PASSWORD -PfreebuffKeyAlias=$ANDROID_KEY_ALIAS -PfreebuffKeyPassword=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "release APK will be signed with the production keystore"
          else
            echo "no ANDROID_KEYSTORE_BASE64 secret; release APK falls back to debug signing (installable, not for store distribution)" >&2
          fi

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          # -PfreebuffPairingOrigin/-PfreebuffWebOrigin stay empty so the
          # release APK is generic and pairs against the HTTPS origin in the QR.
          gradle --no-daemon --stacktrace \
            :app:assembleWebviewRelease \
            ${KEYSTORE_PROPERTIES:-}

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/webview/release/app-webview-release.apk"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${apksigner}"
          test -s "${apk}"
          "${apksigner}" verify --verbose --print-certs "${apk}"

      - name: Publish debug APK as release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/webview/debug/app-webview-debug.apk"
          asset="freebuff-gate-debug.apk"
          tag="mobile-debug-latest"
          cp "$apk" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          # Surface the app version in the release title so releases are
          # identifiable, and keep the rolling tag stable for the installer.
          version_name="$(grep -oP '(?<=versionName = ")[^"]+' android/app/build.gradle.kts | head -1)"
          version_label="${version_name:-dev}"
          title="Freebuff Gate ${version_label} — debug APK (latest)"
          notes="Debug APK ${version_label} rebuilt from ${GITHUB_SHA} and smoke-tested on the API 35 emulator (boot + pairing UI + offline security tests) before upload. Pairs via QR; no baked-in relay origin. System Chromium WebView engine. Verify with: sha256sum -c freebuff-gate-debug.apk.sha256"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" "$asset.sha256" --clobber
            # Keep the APK release pinned as GitHub's "Latest": an unrelated
            # newer tag previously hijacked the Latest badge and hid the app.
            gh release edit "$tag" --title "$title" --draft=false --prerelease=false --latest
          else
            gh release create "$tag" "$asset" "$asset.sha256" \
              --title "$title" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          fi

      - name: Publish release APK as release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/webview/release/app-webview-release.apk"
          asset="freebuff-gate-release.apk"
          tag="mobile-release-latest"
          cp "$apk" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          version_name="$(grep -oP '(?<=versionName = \")[^\"]+' android/app/build.gradle.kts | head -1)"
          version_label="${version_name:-dev}"
          title="Freebuff Gate ${version_label} - release APK (latest)"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            signing_note="Signed with the production keystore."
          else
            signing_note="Signed with the debug key (CI fallback); installable, not for store distribution."
          fi
          notes="Release APK ${version_label} rebuilt from ${GITHUB_SHA}. Pairs via QR; no baked-in relay origin. ${signing_note} Verify with: sha256sum -c freebuff-gate-release.apk.sha256"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" "$asset.sha256" --clobber
            gh release edit "$tag" --title "$title" --draft=false --prerelease=false
          else
            gh release create "$tag" "$asset" "$asset.sha256" \
              --title "$title" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          fi

  release-gecko-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Built without -PfreebuffPairingOrigin/-PfreebuffWebOrigin so the APK
      # is generic and pairs against the HTTPS origin carried by the QR.
      - name: Build unpinned gecko debug APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace :app:assembleGeckoDebug

      - name: Publish gecko spike APK as release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/gecko/debug/app-gecko-debug.apk"
          asset="freebuff-gate-gecko-debug.apk"
          tag="mobile-gecko-latest"
          cp "$apk" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          notes="GeckoView (Firefox engine) spike debug APK rebuilt from ${GITHUB_SHA}. Pairs via QR; no baked-in relay origin. Verify with: sha256sum -c freebuff-gate-gecko-debug.apk.sha256"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" "$asset.sha256" --clobber
          else
            gh release create "$tag" "$asset" "$asset.sha256" \
              --title "Freebuff Gate gecko spike debug APK (latest)" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
