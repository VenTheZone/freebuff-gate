name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - "src/mobile-connect-*.js"
      - "install-mobile-connect.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "src/mobile-connect-*.js"
      - "install-mobile-connect.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Downgrade project format for Xcode 15
        working-directory: ios
        run: |
          # Latest xcodegen emits objectVersion 77, which needs Xcode 16.
          # The macos-14 image ships Xcode 15.4, so pin the object version
          # back to 56 (Xcode 14/15) before building.
          sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/' FreebuffGate.xcodeproj/project.pbxproj
          grep objectVersion FreebuffGate.xcodeproj/project.pbxproj

      - name: Build for simulator (no signing)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project FreebuffGate.xcodeproj \
            -scheme FreebuffGate \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests on simulator
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project FreebuffGate.xcodeproj \
            -scheme FreebuffGate \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Locate built app
        working-directory: ios
        id: app-path
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'FreebuffGate.app' -type d | head -1)
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"

      - name: Upload unsigned simulator app
        if: always() && steps.app-path.outputs.app != ''
        uses: actions/upload-artifact@v4
        with:
          name: FreebuffGate-simulator-unsigned
          path: ${{ steps.app-path.outputs.app }}
          if-no-files-found: error
          retention-days: 14

  signed-ipa:
    # Produces a device-installable IPA when signing secrets are configured.
    # Without an Apple Developer account + certificates, every step below the
    # check is skipped; the simulator build is the default CI path.
    # The gate lives at step level because the `secrets` context is not
    # available in a job-level `if` (using it there makes GitHub reject the
    # whole workflow file before any job is created).
    runs-on: macos-14
    timeout-minutes: 40
    needs: build-test

    steps:
      - name: Check signing secrets
        id: signing
        env:
          CERT: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
          PASS: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PASS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping signed IPA: IOS_SIGNING_CERT_BASE64 / IOS_SIGNING_CERT_PASSWORD are not set"
          fi

      - name: Check out source
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Install XcodeGen
        if: steps.signing.outputs.enabled == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ios
        run: xcodegen generate

      - name: Downgrade project format for Xcode 15
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ios
        run: |
          sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/' FreebuffGate.xcodeproj/project.pbxproj
          grep objectVersion FreebuffGate.xcodeproj/project.pbxproj

      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_SIGNING_CERT_BASE64: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
          IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$IOS_SIGNING_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain -P "$IOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" build.keychain

      - name: Archive signed app
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project FreebuffGate.xcodeproj \
            -scheme FreebuffGate \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/FreebuffGate.xcarchive" \
            -allowProvisioningUpdates \
            archive

      - name: Export IPA
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/FreebuffGate.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FreebuffGate-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

  attach-release:
    # Publishes the unsigned simulator build to the ios-debug-latest release
    # so the iOS app appears on the releases page (parallel to the Android
    # debug APK on mobile-debug-latest). A device-installable IPA is only
    # produced by the signed-ipa job when signing secrets are set.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-test
    if: needs.build-test.result == 'success'

    steps:
      - name: Download simulator app
        uses: actions/download-artifact@v4
        with:
          name: FreebuffGate-simulator-unsigned
          path: ${{ runner.temp }}/app

      - name: Package app + checksum
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=$(find "$RUNNER_TEMP/app" -name 'FreebuffGate.app' -type d | head -1)
          test -n "$APP_DIR"
          cd "$(dirname "$APP_DIR")"
          zip -qry "$RUNNER_TEMP/freebuff-gate-simulator.app.zip" "$(basename "$APP_DIR")"
          sha256sum "$RUNNER_TEMP/freebuff-gate-simulator.app.zip" \
            | tee "$RUNNER_TEMP/freebuff-gate-simulator.app.zip.sha256"

      - name: Publish to ios-debug-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view ios-debug-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ios-debug-latest \
              --title "Freebuff Gate iOS simulator build (latest)" \
              --notes "Unsigned iOS simulator build from main. A device-installable IPA requires the IOS_SIGNING_CERT_BASE64 / IOS_SIGNING_CERT_PASSWORD secrets." \
              --prerelease \
              "$RUNNER_TEMP/freebuff-gate-simulator.app.zip" \
              "$RUNNER_TEMP/freebuff-gate-simulator.app.zip.sha256" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release upload ios-debug-latest \
              "$RUNNER_TEMP/freebuff-gate-simulator.app.zip" \
              "$RUNNER_TEMP/freebuff-gate-simulator.app.zip.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
