name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - "src/mobile-connect-*.js"
      - "install-mobile-connect.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "src/mobile-connect-*.js"
      - "install-mobile-connect.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so generated project files are reproducible; a floating Homebrew
  # install changes the emitted Xcode project format between runs.
  XCODEGEN_VERSION: "2.44.1"

jobs:
  build-test:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/xcodegen"
          mkdir -p "$dest"
          if curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
              "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"; then
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$dest"
            echo "$dest/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::Pinned XcodeGen ${XCODEGEN_VERSION} download failed; falling back to Homebrew (unpinned)"
            brew install xcodegen
          fi
          export PATH="$dest/bin:$PATH"
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Normalize generated project format
        working-directory: ios
        run: |
          set -euo pipefail
          # XcodeGen may emit a project objectVersion newer than the runner's
          # Xcode can open. Pin it back to 56 and fail loudly if the rewrite did
          # not take, instead of building a project the toolchain rejects.
          sed -i '' 's/^\([[:space:]]*\)objectVersion = [0-9]*;/\1objectVersion = 56;/' FreebuffGate.xcodeproj/project.pbxproj
          grep -q 'objectVersion = 56;' FreebuffGate.xcodeproj/project.pbxproj

      - name: Build for simulator (no signing)
        working-directory: ios
        run: |
          set -euo pipefail
          # Simulator builds never need Apple signing; no secrets are required.
          xcodebuild \
            -project FreebuffGate.xcodeproj \
            -scheme FreebuffGate \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests on simulator
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project FreebuffGate.xcodeproj \
            -scheme FreebuffGate \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Locate built app
        working-directory: ios
        id: app-path
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'FreebuffGate.app' -type d | head -1)
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"

      - name: Upload unsigned simulator app
        if: always() && steps.app-path.outputs.app != ''
        uses: actions/upload-artifact@v4
        with:
          name: FreebuffGate-simulator-unsigned
          path: ${{ steps.app-path.outputs.app }}
          if-no-files-found: error
          retention-days: 14

  signed-ipa:
    # Produces a device-installable IPA only when a complete signing
    # configuration is present. All secrets absent = simulator-only run;
    # partially present = fail immediately with the exact missing names
    # instead of a confusing xcodebuild export error.
    runs-on: macos-14
    timeout-minutes: 40
    needs: build-test
    outputs:
      ipa: ${{ steps.signing.outputs.enabled }}

    steps:
      - name: Check signing configuration
        id: signing
        env:
          CERT: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
          PASS: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "$CERT" ]; then missing+=("IOS_SIGNING_CERT_BASE64"); fi
          if [ -z "$PASS" ]; then missing+=("IOS_SIGNING_CERT_PASSWORD"); fi
          if [ -z "$TEAM" ]; then missing+=("IOS_TEAM_ID"); fi
          if [ -z "$PROFILE" ]; then missing+=("IOS_PROVISIONING_PROFILE_BASE64"); fi
          if [ -z "$PROFILE_NAME" ]; then missing+=("IOS_PROVISIONING_PROFILE_NAME"); fi
          if [ "${#missing[@]}" -eq 5 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No iOS signing secrets configured; publishing simulator artifacts only."
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Incomplete iOS signing configuration. Missing: ${missing[*]}"
            echo "Set every signing secret, or none of them, to run the signed job." >&2
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Install XcodeGen (pinned)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/xcodegen"
          mkdir -p "$dest"
          if curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
              "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"; then
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$dest"
            echo "$dest/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::Pinned XcodeGen ${XCODEGEN_VERSION} download failed; falling back to Homebrew (unpinned)"
            brew install xcodegen
          fi
          export PATH="$dest/bin:$PATH"
          xcodegen --version

      - name: Generate Xcode project
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ios
        run: xcodegen generate

      - name: Normalize generated project format
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ios
        run: |
          set -euo pipefail
          sed -i '' 's/^\([[:space:]]*\)objectVersion = [0-9]*;/\1objectVersion = 56;/' FreebuffGate.xcodeproj/project.pbxproj
          grep -q 'objectVersion = 56;' FreebuffGate.xcodeproj/project.pbxproj

      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_SIGNING_CERT_BASE64: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
          IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$IOS_SIGNING_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain -P "$IOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" build.keychain

      - name: Install provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_dir/freebuff.mobileprovision"
          # Fail early if the uploaded profile is not a valid provisioning profile.
          security cms -D -i "$profile_dir/freebuff.mobileprovision" > /dev/null

      - name: Archive signed app
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          # Manual signing with the imported certificate + installed profile.
          # Release config sets FB_APS_ENVIRONMENT=production so the
          # aps-environment entitlement matches a distribution build.
          xcodebuild \
            -project FreebuffGate.xcodeproj \
            -scheme FreebuffGate \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/FreebuffGate.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            archive

      - name: Export IPA
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          # Generate the export options with the team/profile mapping instead of
          # committing an Apple Team ID to the repository.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.freebuff.gate</key><string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/FreebuffGate.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates

      - name: Upload IPA
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FreebuffGate-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

  attach-release:
    # Publishes the unsigned simulator build to the ios-debug-latest release
    # so the iOS app appears on the releases page (parallel to the Android
    # debug APK on mobile-debug-latest), and the signed IPA to ios-latest
    # when the signing secrets are set. Runs only on main so PRs never touch
    # the rolling releases.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-test, signed-ipa]
    # always() so a misconfigured signing job cannot block the simulator
    # artifact from publishing on main; the IPA steps below stay gated on the
    # signed job's own result.
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.build-test.result == 'success' }}

    steps:
      - name: Download simulator app
        uses: actions/download-artifact@v4
        with:
          name: FreebuffGate-simulator-unsigned
          path: ${{ runner.temp }}/app

      - name: Package app + checksum
        shell: bash
        run: |
          set -euo pipefail
          # upload-artifact v4 stores a single-directory path FLATTENED: the
          # artifact root IS the app contents (Info.plist, Frameworks/, ...),
          # there is no FreebuffGate.app/ directory inside. Rebuild it.
          test -f "$RUNNER_TEMP/app/Info.plist"
          mkdir -p "$RUNNER_TEMP/staged/FreebuffGate.app"
          cp -R "$RUNNER_TEMP/app/." "$RUNNER_TEMP/staged/FreebuffGate.app/"
          cd "$RUNNER_TEMP/staged"
          zip -qry "$RUNNER_TEMP/freebuff-gate-simulator.app.zip" FreebuffGate.app
          sha256sum "$RUNNER_TEMP/freebuff-gate-simulator.app.zip" \
            | tee "$RUNNER_TEMP/freebuff-gate-simulator.app.zip.sha256"

      - name: Publish to ios-debug-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view ios-debug-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ios-debug-latest \
              --title "Freebuff Gate iOS simulator build (latest)" \
              --notes "Unsigned iOS simulator build from main. A device-installable IPA requires the IOS_SIGNING_CERT_BASE64 / IOS_SIGNING_CERT_PASSWORD / IOS_TEAM_ID / IOS_PROVISIONING_PROFILE_BASE64 / IOS_PROVISIONING_PROFILE_NAME secrets." \
              --prerelease \
              "$RUNNER_TEMP/freebuff-gate-simulator.app.zip" \
              "$RUNNER_TEMP/freebuff-gate-simulator.app.zip.sha256" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release upload ios-debug-latest \
              "$RUNNER_TEMP/freebuff-gate-simulator.app.zip" \
              "$RUNNER_TEMP/freebuff-gate-simulator.app.zip.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi

      - name: Download signed IPA
        if: needs.signed-ipa.result == 'success' && needs.signed-ipa.outputs.ipa == 'true'
        uses: actions/download-artifact@v4
        with:
          name: FreebuffGate-ipa
          path: ${{ runner.temp }}/ipa

      - name: Publish signed IPA to ios-latest release
        if: needs.signed-ipa.result == 'success' && needs.signed-ipa.outputs.ipa == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ipa=$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -type f | head -1)
          test -n "$ipa"
          cp "$ipa" freebuff-gate.ipa
          sha256sum freebuff-gate.ipa > freebuff-gate.ipa.sha256
          if ! gh release view ios-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ios-latest \
              --title "Freebuff Gate iOS app (latest)" \
              --notes "Ad-hoc signed IPA from main (device-installable, up to 100 registered devices). Verify with: sha256sum -c freebuff-gate.ipa.sha256" \
              --prerelease \
              freebuff-gate.ipa freebuff-gate.ipa.sha256 \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release upload ios-latest \
              freebuff-gate.ipa freebuff-gate.ipa.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
