name: Commit identity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify commit identities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject unapproved authors and committers
        env:
          APPROVED_EMAILS: |
            kytusdevenn@gmail.com
            youlianvr@gmail.com
            youlianvr2@gmail.com
            noreply@github.com
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          while IFS=$'\t' read -r commit author_email committer_email; do
            if ! grep -qxF "$author_email" <<< "$APPROVED_EMAILS"; then
              printf 'Unapproved author email: %s <%s>\n' "$commit" "$author_email" >&2
              failures=1
            fi
            if ! grep -qxF "$committer_email" <<< "$APPROVED_EMAILS"; then
              printf 'Unapproved committer email: %s <%s>\n' "$commit" "$committer_email" >&2
              failures=1
            fi
          done < <(git log --all --format='%H%x09%ae%x09%ce')

          if (( failures )); then
            echo "Commit identity check failed." >&2
            echo "Approved emails: $APPROVED_EMAILS" >&2
            exit 1
          fi

          echo "All reachable commits use an approved identity."
