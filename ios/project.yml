name: FreebuffGate
options:
  bundleIdPrefix: com.freebuff
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
targets:
  FreebuffGate:
    type: application
    platform: iOS
    sources:
      - path: FreebuffGate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freebuff.gate
        MARKETING_VERSION: "0.1.13"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: FreebuffGate/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: FreebuffGate/FreebuffGate.entitlements
        # Empty by default: a generic build pairs against the exact HTTPS
        # origin carried by the QR code and pins the relay origin returned by
        # the claim. A production/CI build overrides these on the xcodebuild
        # command line (xcodebuild ... FB_DEFAULT_WEB_ORIGIN=https://relay...).
        # Never hardcode a production origin in Swift source.
        FB_DEFAULT_WEB_ORIGIN: ""
        FB_DEFAULT_PAIRING_ORIGIN: ""
        FB_APS_ENVIRONMENT: development
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          # The APNs environment must match the signing/provisioning path:
          # development for sandbox builds, production for TestFlight/App Store.
          FB_APS_ENVIRONMENT: production
  FreebuffGateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FreebuffGateTests
    dependencies:
      - target: FreebuffGate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freebuff.gate.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
schemes:
  FreebuffGate:
    build:
      targets:
        FreebuffGate: all
    test:
      targets:
        - FreebuffGateTests
